<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
           background: #0a1628; color: #e2e8f0; padding: 16px; }
    h1 { font-size: 14px; margin: 0 0 2px; color: #fff; }
    p { color: #94a3b8; font-size: 12px; margin: 0 0 14px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; cursor: pointer;
             font-weight: 600; font-size: 13px; background: #2563eb; color: #fff; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 10px; font-size: 12px; color: #64748b; min-height: 16px; }
  </style>
</head>
<body>
  <h1>🤖 AutonomousHire Autofill</h1>
  <p>Fills this application from your profile. You review, solve any CAPTCHA, and submit.</p>
  <button id="fill">Fill this application</button>
  <button id="fillAll" style="margin-top:8px;background:#7c3aed">Fill ALL open application tabs</button>
  <button id="incognito" style="margin-top:8px;background:#0f766e" title="For sites that block normal tabs with a 403 (PerimeterX), e.g. TEKsystems. Requires 'Allow in incognito' enabled.">Reopen in incognito + fill (PerimeterX sites)</button>
  <button id="capture" style="margin-top:8px;background:#475569;font-size:12px" title="DEBUG: send this form's field structure for analysis (no personal values).">Capture form DOM (debug)</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
