[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "autonomoushire"
version = "0.1.0"
description = "AI-powered autonomous job search system"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "tools*", "orchestration*", "dashboard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"



